<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ส่งแบบประเมินสำเร็จ</title>
<style>
  body { margin:0; background:#f4f7f5; color:#1c2b24; font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif; }
  .page { max-width:640px; margin:0 auto; padding:20px 16px 60px; }
  .card { background:#fff; border:1px solid #dde5e0; border-radius:14px; padding:24px 20px; text-align:center; }
  h1 { font-size:1.3rem; color:#145840; margin:0 0 8px; }
</style>
</head>
<body>
<main class="page">
  <div class="card">
    <h1>ขอบคุณสำหรับการประเมินผล</h1>
    <p>ระบบได้บันทึกคำตอบของท่านเรียบร้อยแล้ว</p>
  </div>
</main>
<script>
// Remember which form was just sent, so the form page clears itself if the
// participant presses Back, and delete the auto-saved answers (see form.html).
try {
  var id = sessionStorage.getItem('sf_submission_id');
  if (id) sessionStorage.setItem('sf_sent_id', id);
  sessionStorage.removeItem('sf_draft');
} catch (e) {}
</script>
</body>
</html>
